<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixmyresume</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#252422] text-[#FFFCF2] font-['Cabin_Sketch',cursive] min-h-screen flex flex-col">

  <header class="text-[#EB5E28] p-4 sm:p-5">
    <a href="index.html" class="no-underline">
      <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold text-center">Fixmyresume</h1>
    </a>
  </header>

  <main class="flex-1 px-4 sm:px-6 pb-6 max-w-4xl mx-auto w-full flex flex-col">
    <section class="w-full bg-[#403D39] border-4 border-[#EB5E28] rounded-2xl p-4 sm:p-6 flex flex-col min-h-[500px] shadow-lg flex-1">
      <h2 class="text-2xl sm:text-3xl text-[#FFFCF2] font-extrabold mb-3 text-center">Your AI-Crafted Cover Letter</h2>

      <div class="flex-1 rounded-xl border-2 border-[#EB5E28]/40 bg-[#252422] p-2 min-h-[380px]">
        <iframe
          id="coverPdfPreview"
          title="AI Cover Letter PDF Preview"
          src="about:blank"
          class="w-full h-full min-h-[380px] rounded-lg bg-[#252422]"
        ></iframe>
      </div>

      <div class="mt-4 flex flex-wrap items-center justify-center gap-3">
        <div class="group relative">
          <button
            id="downloadCoverBtn"
            class="bg-[#CCC5B9] w-10 h-10 flex justify-center items-center rounded-lg hover:text-[#EB5E28] hover:translate-y-0.5 cursor-pointer transition shadow"
            aria-label="Download cover letter"
          >
            <svg
              class="w-6 h-6"
              stroke="currentColor"
              stroke-width="1.5"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"
                stroke-linejoin="round"
                stroke-linecap="round"
              ></path>
            </svg>
          </button>
          <span
            id="coverSizeHint"
            class="absolute w-28 text-center -bottom-12 left-[50%] -translate-x-[50%] origin-bottom tracking-wider z-20 scale-0 px-1 rounded-lg bg-white text-[#EB5E28] py-1.5 text-sm transition-all duration-200 group-hover:scale-100 shadow-md font-sans font-bold"
          >PDF</span>
        </div>

        <div class="flex items-center gap-2">
          <label for="coverExportFormat" class="text-lg text-[#FFFCF2]">Export as</label>
          <select id="coverExportFormat" class="bg-[#252422] border-2 border-[#EB5E28] rounded-lg px-3 py-1.5 text-[#FFFCF2] text-base cursor-pointer">
            <option value="pdf" selected>PDF</option>
            <option value="docx">DOCX</option>
          </select>
        </div>
      </div>
    </section>

    <div class="mt-4 flex justify-center">
      <a
        href="resume.html"
        class="text-[#EB5E28] hover:text-[#FFFCF2] transition text-lg sm:text-xl font-bold flex items-center gap-1.5"
      >
        &larr; Back to Resume
      </a>
    </div>
  </main>

  <script src="cover.js"></script>
</body>
</html>
