<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#252422] text-[#FFFCF2] font-['Cabin_Sketch',cursive] h-screen overflow-hidden flex flex-col">
<header class="text-[#EB5E28] p-4">
<a href="index.html" class="no-underline">
<h1 class="text-6xl font-bold text-center">Fixmyresume</h1>
</a>
</header>

<main class="flex-1 px-6 pb-6 min-h-0 flex justify-center">
<section class="h-full w-full max-w-4xl bg-[#403D39] border-4 border-[#EB5E28] rounded-2xl p-4 min-h-0 flex flex-col">
<h2 class="text-3xl text-[#FFFCF2] font-extrabold mb-3 text-center">Your AI-Crafted Cover Letter</h2>

<div class="flex-1 rounded-xl border-2 border-[#EB5E28]/40 bg-[#252422] p-2 min-h-0">
<iframe
id="coverPdfPreview"
title="AI Cover Letter PDF Preview"
src="about:blank"
class="w-full h-full rounded-lg bg-[#252422]"
></iframe>
</div>

<div class="mt-3 flex items-center justify-center gap-3">
<div class="group relative">
<button
id="downloadCoverBtn"
class="bg-[#CCC5B9] w-10 h-10 flex justify-center items-center rounded-lg hover:text-[#EB5E28] hover:translate-y-1 hover:duration-300 cursor-pointer transition"
aria-label="Download cover letter"
>
<svg
class="w-6 h-6"
stroke="currentColor"
stroke-width="1.5"
viewBox="0 0 24 24"
fill="none"
xmlns="http://www.w3.org/2000/svg"
>
<path
d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"
stroke-linejoin="round"
stroke-linecap="round"
></path>
</svg>
</button>

</div>

<div class="flex items-center gap-2">
<label for="coverExportFormat" class="text-lg text-[#FFFCF2]">Export as</label>
<select id="coverExportFormat" class="bg-[#252422] border-2 border-[#EB5E28] rounded-lg px-3 py-2 text-[#FFFCF2] text-base">
<option value="pdf" selected>PDF</option>
<option value="docx">DOCX</option>
</select>
</div>
</div>
</section>
</main>

<script src="cover.js"></script>
</body>
</html>
