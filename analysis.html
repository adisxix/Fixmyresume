<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixmyresume</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#252422] text-[#FFFCF2] font-['Cabin_Sketch',cursive] min-h-screen flex flex-col">

  <header class="text-[#EB5E28] p-4 sm:p-6">
    <a href="index.html" class="no-underline">
      <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold text-center">Fixmyresume</h1>
    </a>
  </header>

  <main class="flex-1 flex flex-col px-4 sm:px-6 md:px-8 pb-6 md:pb-8 max-w-7xl mx-auto w-full">
    <div class="w-full flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">

      <div class="col-span-1 lg:col-span-5 flex flex-col gap-6">
        <div class="bg-[#CCC5B9] rounded-2xl border-4 border-[#EB5E28] p-5 sm:p-6 text-[#403D39] font-bold shadow-lg">
          <h2 class="text-2xl sm:text-3xl font-extrabold text-[#252422] mb-4">Analysis</h2>
          <ul class="space-y-3 text-lg sm:text-xl leading-tight">
            <li class="flex items-center gap-3">
              <span class="shrink-0">1. Overall Score</span>
              <span id="overallScoreText" class="font-bold text-[#EB5E28]"></span>
              <div class="flex-1 h-3.5 bg-[#252422]/20 rounded-full overflow-hidden border border-[#252422]/20">
                <div id="overallScoreBar" class="h-full bg-[#EB5E28] transition-all duration-500" style="width: 0%;"></div>
              </div>
            </li>
            <li class="flex items-center justify-between gap-2 border-t border-[#252422]/10 pt-2">
              <span>2. ATS Friendly</span>
              <span id="atsFriendly" class="font-extrabold text-[#252422]"></span>
            </li>
            <li class="flex items-center justify-between gap-2 border-t border-[#252422]/10 pt-2">
              <span>3. Tone Analysis</span>
              <span id="toneAnalysis" class="font-extrabold text-[#252422]"></span>
            </li>
            <li class="flex items-center justify-between gap-2 border-t border-[#252422]/10 pt-2">
              <span>4. Clarity</span>
              <span id="clarityLevel" class="font-extrabold text-[#252422]"></span>
            </li>
          </ul>
        </div>

        <div class="bg-[#CCC5B9] rounded-2xl border-4 border-[#EB5E28] p-5 sm:p-6 text-[#403D39] font-bold shadow-lg flex-1">
          <h2 class="text-2xl sm:text-3xl font-extrabold text-[#252422] mb-3">Suggestions</h2>
          <ul id="suggestionsList" class="space-y-2.5 text-base sm:text-lg leading-relaxed list-decimal list-inside">
          </ul>
        </div>
      </div>

      <div class="col-span-1 lg:col-span-7 bg-[#CCC5B9] rounded-2xl border-4 border-[#EB5E28] p-5 sm:p-6 text-[#403D39] font-bold shadow-lg flex flex-col">
        <h2 class="text-2xl sm:text-3xl font-extrabold text-[#252422] mb-4">Section Analysis</h2>
        <div id="sectionAnalysis" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-base md:text-lg">
        </div>
      </div>

    </div>

    <div class="mt-8 flex justify-center">
      <button
        id="fixResumeBtn"
        class="relative py-3 px-10 text-[#252422] text-xl font-extrabold rounded-full overflow-hidden bg-[#CCC5B9] transition-all duration-300 ease-in-out shadow-md hover:scale-105 hover:text-[#FFFCF2] hover:shadow-lg active:scale-95 before:absolute before:top-0 before:-left-full before:w-full before:h-full before:bg-[#EB5E28] before:transition-all before:duration-300 before:ease-in-out before:z-[-1] before:rounded-full hover:before:left-0 cursor-pointer"
      >
        Fix My Resume
      </button>
    </div>
  </main>

  <section id="analysisLoader" class="hidden fixed inset-0 z-50 bg-[#252422] flex-col items-center justify-center px-6 text-center">
    <div class="flex flex-row gap-2">
      <div class="w-4 h-4 rounded-full bg-[#EB5E28] animate-bounce"></div>
      <div class="w-4 h-4 rounded-full bg-[#EB5E28] animate-bounce [animation-delay:-.3s]"></div>
      <div class="w-4 h-4 rounded-full bg-[#EB5E28] animate-bounce [animation-delay:-.5s]"></div>
    </div>
    <p id="analysisLoaderText" class="mt-8 text-2xl text-[#FFFCF2]">Fixing things up...</p>
  </section>

  <script src="analysis.js"></script>
</body>
</html>
