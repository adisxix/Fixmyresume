<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#252422] text-[#FFFCF2] font-['Cabin_Sketch',cursive] h-screen overflow-hidden flex flex-col">

<header class="text-[#EB5E28] p-4">
<a href="index.html" class="no-underline">
<h1 class="text-6xl font-bold text-center">Fixmyresume</h1>
</a>
</header>

<main class="flex-1 flex flex-col px-8 pb-8 min-h-0">

<div class="w-full flex-1 min-h-0 grid grid-cols-12 gap-6">
<div class="col-span-5 flex flex-col gap-4 min-h-0">
<div class="bg-[#CCC5B9] flex-1 rounded-2xl border-4 border-[#EB5E28] p-4 text-[#403D39] font-bold overflow-hidden">
<h2 class="text-3xl font-extrabold text-[#252422] mb-3">Analysis</h2>

<ul class="space-y-3 text-xl leading-tight">
<li class="flex items-center gap-2">
<span class="shrink-0">1. Overall Score</span>
<span id="overallScoreText" class="font-bold"></span>
<div class="flex-1 h-3 bg-[#252422]/20 rounded-full overflow-hidden border border-[#252422]/20">
<div id="overallScoreBar" class="h-full bg-[#EB5E28]" style="width: 0%;"></div>
</div>
</li>

<li class="flex items-center justify-between gap-2">
<span>2. ATS Friendly</span>
<span id="atsFriendly" class="font-bold"></span>
</li>

<li class="flex items-center justify-between gap-2">
<span>3. Tone Analysis</span>
<span id="toneAnalysis" class="font-bold"></span>
</li>

<li class="flex items-center justify-between gap-2">
<span>4. Clarity</span>
<span id="clarityLevel" class="font-bold"></span>
</li>
</ul>
</div>
<div class="bg-[#CCC5B9] flex-1 rounded-2xl border-4 border-[#EB5E28] p-4 text-[#403D39] font-bold overflow-hidden">
<h2 class="text-3xl font-extrabold text-[#252422] mb-3">Suggestions</h2>

<ul id="suggestionsList" class="space-y-3 text-xl leading-tight list-decimal list-inside">
</ul>
</div>
</div>

<div class="bg-[#CCC5B9] col-span-7 h-full rounded-2xl border-4 border-[#EB5E28] p-4 text-[#403D39] font-bold overflow-hidden">
<h2 class="text-3xl font-extrabold text-[#252422] mb-6">Section Analysis</h2>

<div id="sectionAnalysis" class="grid grid-cols-3 gap-3 text-lg">
</div>
</div>
</div>

<div class="mt-6 flex justify-center">
<button
id="fixResumeBtn"
class="relative py-2 px-8 text-[#252422] text-xl font-extrabold rounded-full overflow-hidden bg-[#CCC5B9] transition-all duration-400 ease-in-out shadow-md hover:scale-105 hover:text-[#FFFCF2] hover:shadow-lg active:scale-90 before:absolute before:top-0 before:-left-full before:w-full before:h-full before:bg-[#EB5E28] before:transition-all before:duration-500 before:ease-in-out before:z-[-1] before:rounded-full hover:before:left-0 cursor-pointer"
>
Fix My Resume
</button>
</div>

</main>

<section id="analysisLoader" class="hidden fixed inset-0 z-50 bg-[#252422] flex-col items-center justify-center px-6 text-center">
<div class="flex flex-row gap-2">
	<div class="w-4 h-4 rounded-full bg-[#EB5E28] animate-bounce"></div>
	<div class="w-4 h-4 rounded-full bg-[#EB5E28] animate-bounce [animation-delay:-.3s]"></div>
	<div class="w-4 h-4 rounded-full bg-[#EB5E28] animate-bounce [animation-delay:-.5s]"></div>
</div>

<p id="analysisLoaderText" class="mt-8 text-2xl text-[#FFFCF2]">Fixing things up...</p>
</section>

<script src="analysis.js"></script>

</body>
</html>
